<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V10 Machine Registry</title>
<style>body{font-family:Segoe UI,Arial,sans-serif;margin:20px;background:#f6f7fb;color:#182033}.cards{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:12px}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:16px;box-shadow:0 2px 10px #0001}.card b{font-size:30px;display:block}.toolbar{display:flex;gap:10px;margin:16px 0}input,select{padding:10px;border:1px solid #ccc;border-radius:8px}table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}th{background:#eef2ff}.ok{color:#07833b;font-weight:700}.bad{color:#bb1d2a;font-weight:700}small{color:#657085}</style></head><body>
<h1>V10 Machine Registry Proof</h1><p>This is not a new UI. It is the registry proof page. Once count is approved, old dashboard will use this registry.</p>
<div class="cards"><div class="card">Raw latest rows<b id="raw">-</b></div><div class="card">Real machines<b id="real">-</b></div><div class="card">Online<b id="online">-</b></div><div class="card">Offline<b id="offline">-</b></div><div class="card">Attention<b id="attention">-</b></div></div>
<div class="toolbar"><input id="q" placeholder="Search hostname, IP, serial, MAC" oninput="render()"><select id="filter" onchange="render()"><option value="all">All</option><option value="online">Online</option><option value="offline">Offline</option><option value="dup">Merged/duplicates</option></select><a href="/v10_machine_registry.csv">Download CSV</a></div>
<div id="rule"></div><table><thead><tr><th>Machine</th><th>Status</th><th>Identity</th><th>Merged rows</th><th>Serial/MAC/IP</th><th>Last seen</th></tr></thead><tbody id="rows"></tbody></table>
<script>
let data=[]; async function load(){const r=await fetch('/v10_machine_registry.json?ts='+Date.now()); const j=await r.json(); data=j.machines||[]; raw.textContent=j.summary.raw_latest_rows; real.textContent=j.summary.real_machine_count; online.textContent=j.summary.online_count; offline.textContent=j.summary.offline_count; attention.textContent=j.summary.attention_count; rule.innerHTML='<p><b>Rule:</b> '+j.summary.rule+'</p><p><b>Reference:</b> '+j.summary.reference_time+' | timeout '+j.summary.online_timeout_minutes+' min | duplicate groups '+j.summary.duplicate_groups+'</p>'; render();}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){const qv=(q.value||'').toLowerCase(); const f=filter.value; let list=data.filter(m=>{const hay=JSON.stringify(m).toLowerCase(); if(qv&&!hay.includes(qv))return false; if(f==='online'&&!m.online)return false; if(f==='offline'&&m.online)return false; if(f==='dup'&&Number(m.rows_merged||0)<=1)return false; return true;}); rows.innerHTML=list.map(m=>`<tr><td><b>${esc(m.display_name)}</b><br><small>${esc(m.current_machine_id)}</small></td><td class="${m.online?'ok':'bad'}">${m.online?'Online':'Offline'}${m.attention?'<br><span class=bad>Attention</span>':''}</td><td>${esc(m.identity_source)}<br><small>${esc(m.real_machine_id)}</small></td><td>${esc(m.rows_merged)}</td><td><small>Serial: ${esc((m.serials_seen||[]).join(' | '))}</small><br><small>MAC: ${esc((m.macs_seen||[]).slice(0,4).join(' | '))}</small><br><small>IP: ${esc((m.ips_seen||[]).slice(0,4).join(' | '))}</small></td><td>${esc(m.last_seen)}</td></tr>`).join('')||'<tr><td colspan=6>No data</td></tr>';}
load().catch(e=>{document.body.insertAdjacentHTML('beforeend','<pre>'+esc(e.stack||e)+'</pre>')});
</script></body></html>
